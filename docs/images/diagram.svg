<rect x="256" y="106" width="448" height="448" rx="20" class="bezel"/><image x="280" y="130" width="400" height="400" href="data:image/png;base64,"/><line x1="314" y1="92" x2="314" y2="150" class="l"/><circle cx="314" cy="150" r="4" class="d"/><text x="314" y="68" text-anchor="middle" class="t">Wi-Fi</text><text x="314" y="85" text-anchor="middle" class="s">slashed when offline</text><line x1="414" y1="50" x2="414" y2="150" class="l"/><circle cx="414" cy="150" r="4" class="d"/><text x="414" y="26" text-anchor="middle" class="t">Temperature</text><text x="414" y="43" text-anchor="middle" class="s">outdoor, or onboard sensor</text><line x1="546" y1="92" x2="546" y2="150" class="l"/><circle cx="546" cy="150" r="4" class="d"/><text x="546" y="68" text-anchor="middle" class="t">Humidity</text><text x="546" y="85" text-anchor="middle" class="s">same source as temperature</text><line x1="646" y1="50" x2="646" y2="150" class="l"/><circle cx="646" cy="150" r="4" class="d"/><text x="646" y="26" text-anchor="middle" class="t">Battery</text><text x="646" y="43" text-anchor="middle" class="s">fill shows charge</text><line x1="240" y1="298" x2="292" y2="298" class="l"/><circle cx="292" cy="298" r="4" class="d"/><text x="232" y="294" text-anchor="end" class="t">Bins</text><text x="232" y="311" text-anchor="end" class="s">rubbish, recycling, food scraps</text><line x1="240" y1="464" x2="348" y2="464" class="l"/><circle cx="348" cy="464" r="4" class="d"/><text x="232" y="460" text-anchor="end" class="t">Next pickup day</text><text x="232" y="477" text-anchor="end" class="s">TONIGHT, then TODAY, on a black strip</text><polyline points="720,386 504,386 504,334" fill="none" class="l"/><circle cx="504" cy="334" r="4" class="d"/><text x="728" y="382" text-anchor="start" class="t">Slashed bin</text><text x="728" y="399" text-anchor="start" class="s">not collected this pickup</text><text x="347.0" y="576" text-anchor="middle" class="t">Rubbish</text><text x="479.0" y="576" text-anchor="middle" class="t">Recycling</text><text x="611.0" y="576" text-anchor="middle" class="t">Food scraps</text><rect x="256" y="592" width="448" height="136" rx="14" class="bezel"/><svg x="280" y="606" width="400" height="108" viewBox="0 280 400 108"><image width="400" height="400" href="data:image/png;base64,"/></svg><line x1="240" y1="660" x2="334" y2="660" class="l"/><circle cx="334" cy="660" r="4" class="d"/><text x="232" y="648" text-anchor="end" class="t">Out of date</text><text x="232" y="665" text-anchor="end" class="s">pickup day passed, or last</text><text x="232" y="682" text-anchor="end" class="s">fetch more than 48 h ago</text><text x="728" y="648" text-anchor="start" class="t">Replaces the pickup day</text><text x="728" y="665" text-anchor="start" class="s">TODAY and TONIGHT</text><text x="728" y="682" class="s">aren't shown</text><text x="40" y="780" class="h">On the board</text><line x1="40" y1="792" x2="920" y2="792" class="rule"/><line x1="96" y1="820" x2="96" y2="812" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="111.62" y1="826.38" x2="117.3" y2="820.7" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="118" y1="842" x2="126" y2="842" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="111.62" y1="857.62" x2="117.3" y2="863.3" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="96" y1="864" x2="96" y2="872" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="80.38" y1="857.62" x2="74.7" y2="863.3" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="74" y1="842" x2="66" y2="842" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="80.38" y1="826.38" x2="74.7" y2="820.7" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><circle cx="96" cy="842" r="14" fill="#2da44e" stroke="#1a7f37" stroke-width="2"/><circle cx="92" cy="838" r="4" fill="#aceebb"/><text x="96" y="892" text-anchor="middle" class="t">Green LED</text><text x="96" y="912" text-anchor="middle" class="s">Blinks for 10 s every</text><text x="96" y="929" text-anchor="middle" class="s">10 min below 10% battery</text><rect x="246" y="824" width="52" height="36" rx="6" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><circle cx="272" cy="842" r="11" fill="#424a53"/><text x="272" y="892" text-anchor="middle" class="t">PWR button</text><text x="272" y="912" text-anchor="middle" class="s">Press to restart and</text><text x="272" y="929" text-anchor="middle" class="s">refresh; powers on</text><text x="272" y="946" text-anchor="middle" class="s">from battery</text><rect x="422" y="824" width="52" height="36" rx="6" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><circle cx="448" cy="842" r="11" fill="#424a53"/><text x="448" y="892" text-anchor="middle" class="t">BOOT button</text><text x="448" y="912" text-anchor="middle" class="s">Hold while powering on</text><text x="448" y="929" text-anchor="middle" class="s">for download mode</text><rect x="598" y="831" width="52" height="22" rx="11" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><rect x="610" y="839" width="28" height="6" rx="3" fill="#424a53"/><text x="624" y="892" text-anchor="middle" class="t">USB-C</text><text x="624" y="912" text-anchor="middle" class="s">Power, charging,</text><text x="624" y="929" text-anchor="middle" class="s">flashing and logs</text><rect x="776" y="829" width="44" height="26" rx="4" fill="none" stroke="#424a53" stroke-width="3"/><rect x="820" y="836" width="5" height="12" fill="#424a53"/><rect x="781" y="834" width="24" height="16" fill="#424a53"/><text x="800" y="892" text-anchor="middle" class="t">Battery header</text><text x="800" y="912" text-anchor="middle" class="s">MX1.25, 3.7V lithium</text><text x="800" y="929" text-anchor="middle" class="s">cell, charged over USB</text>
</svg>
