<rect x="256" y="106" width="448" height="448" rx="20" class="bezel"/><image x="280" y="130" width="400" height="400" href="data:image/png;base64,"/><line x1="314" y1="92" x2="314" y2="150" class="l"/><circle cx="314" cy="150" r="4" class="d"/><text x="314" y="68" text-anchor="middle" class="t">Wi-Fi</text><text x="314" y="85" text-anchor="middle" class="s">slashed when offline</text><line x1="414" y1="50" x2="414" y2="150" class="l"/><circle cx="414" cy="150" r="4" class="d"/><text x="414" y="26" text-anchor="middle" class="t">Temperature</text><text x="414" y="43" text-anchor="middle" class="s">outdoor, or onboard sensor</text><line x1="546" y1="92" x2="546" y2="150" class="l"/><circle cx="546" cy="150" r="4" class="d"/><text x="546" y="68" text-anchor="middle" class="t">Humidity</text><text x="546" y="85" text-anchor="middle" class="s">same source as temperature</text><line x1="646" y1="50" x2="646" y2="150" class="l"/><circle cx="646" cy="150" r="4" class="d"/><text x="646" y="26" text-anchor="middle" class="t">Battery</text><text x="646" y="43" text-anchor="middle" class="s">fill shows charge</text><line x1="240" y1="298" x2="292" y2="298" class="l"/><circle cx="292" cy="298" r="4" class="d"/><text x="232" y="294" text-anchor="end" class="t">Bins</text><text x="232" y="311" text-anchor="end" class="s">rubbish, recycling, food scraps</text><line x1="240" y1="464" x2="348" y2="464" class="l"/><circle cx="348" cy="464" r="4" class="d"/><text x="232" y="460" text-anchor="end" class="t">Next pickup day</text><text x="232" y="477" text-anchor="end" class="s">TONIGHT, then TODAY, on a black strip</text><polyline points="720,386 504,386 504,334" fill="none" class="l"/><circle cx="504" cy="334" r="4" class="d"/><text x="728" y="382" text-anchor="start" class="t">Slashed bin</text><text x="728" y="399" text-anchor="start" class="s">not collected this pickup</text><text x="347.0" y="576" text-anchor="middle" class="t">Rubbish</text><text x="479.0" y="576" text-anchor="middle" class="t">Recycling</text><text x="611.0" y="576" text-anchor="middle" class="t">Food scraps</text><text x="40" y="638" class="h">On the board</text><line x1="40" y1="650" x2="920" y2="650" class="rule"/><line x1="96" y1="678" x2="96" y2="670" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="111.62" y1="684.38" x2="117.3" y2="678.7" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="118" y1="700" x2="126" y2="700" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="111.62" y1="715.62" x2="117.3" y2="721.3" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="96" y1="722" x2="96" y2="730" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="80.38" y1="715.62" x2="74.7" y2="721.3" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="74" y1="700" x2="66" y2="700" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><line x1="80.38" y1="684.38" x2="74.7" y2="678.7" stroke="#1a7f37" stroke-width="2.5" stroke-linecap="round"/><circle cx="96" cy="700" r="14" fill="#2da44e" stroke="#1a7f37" stroke-width="2"/><circle cx="92" cy="696" r="4" fill="#aceebb"/><text x="96" y="750" text-anchor="middle" class="t">Green LED</text><text x="96" y="770" text-anchor="middle" class="s">Blinks for 10 s every</text><text x="96" y="787" text-anchor="middle" class="s">10 min below 10% battery</text><rect x="246" y="682" width="52" height="36" rx="6" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><circle cx="272" cy="700" r="11" fill="#424a53"/><text x="272" y="750" text-anchor="middle" class="t">PWR button</text><text x="272" y="770" text-anchor="middle" class="s">Press to restart and</text><text x="272" y="787" text-anchor="middle" class="s">refresh; powers on</text><text x="272" y="804" text-anchor="middle" class="s">from battery</text><rect x="422" y="682" width="52" height="36" rx="6" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><circle cx="448" cy="700" r="11" fill="#424a53"/><text x="448" y="750" text-anchor="middle" class="t">BOOT button</text><text x="448" y="770" text-anchor="middle" class="s">Hold while powering on</text><text x="448" y="787" text-anchor="middle" class="s">for download mode</text><rect x="598" y="689" width="52" height="22" rx="11" fill="#d0d7de" stroke="#6e7781" stroke-width="2"/><rect x="610" y="697" width="28" height="6" rx="3" fill="#424a53"/><text x="624" y="750" text-anchor="middle" class="t">USB-C</text><text x="624" y="770" text-anchor="middle" class="s">Power, charging,</text><text x="624" y="787" text-anchor="middle" class="s">flashing and logs</text><rect x="776" y="687" width="44" height="26" rx="4" fill="none" stroke="#424a53" stroke-width="3"/><rect x="820" y="694" width="5" height="12" fill="#424a53"/><rect x="781" y="692" width="24" height="16" fill="#424a53"/><text x="800" y="750" text-anchor="middle" class="t">Battery header</text><text x="800" y="770" text-anchor="middle" class="s">MX1.25, 3.7V lithium</text><text x="800" y="787" text-anchor="middle" class="s">cell, charged over USB</text>
