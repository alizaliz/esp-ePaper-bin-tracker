# Weekly check that the Auckland Council collection day page still parses, so
# a website redesign is noticed before it leaves boards showing stale dates.
#
# Needs a repository secret COUNCIL_CHECK_ASSESSMENT_NUMBER with any valid
# Auckland assessment number. It's a secret so the address isn't published.
name: Council page check

on:
  schedule:
    - cron: "17 20 * * 0"  # Mondays 08:17/09:17 NZ time
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the collection day page
        env:
          ASSESSMENT_NUMBER: ${{ secrets.COUNCIL_CHECK_ASSESSMENT_NUMBER }}
        run: |
          # Strip spaces or a trailing newline pasted into the secret.
          ASSESSMENT_NUMBER=$(printf '%s' "$ASSESSMENT_NUMBER" | tr -d '[:space:]')
          if [ -z "$ASSESSMENT_NUMBER" ]; then
            echo "::error::Set the COUNCIL_CHECK_ASSESSMENT_NUMBER repository secret"
            exit 1
          fi
          URL="https://www.aucklandcouncil.govt.nz/en/rubbish-recycling/rubbish-recycling-collections/rubbish-recycling-collection-days/${ASSESSMENT_NUMBER}.html"
          # The Council's CDN sometimes refuses requests for a while (HTTP 406
          # or 403), so retry a few times before giving up. The URL isn't
          # printed, so the assessment number stays out of the logs.
          for attempt in 1 2 3 4; do
            status=$(curl -s --max-time 30 -A "esp-ePaper-bin-tracker" -o page.html -w '%{http_code}' "$URL" || echo "000")
            echo "Attempt $attempt: HTTP $status"
            [ "$status" = "200" ] && exit 0
            [ "$attempt" -lt 4 ] && sleep 60
          done
          case "$status" in
            404) echo "::error::Page not found (HTTP 404). Check the assessment number in the secret." ;;
            403|406|429) echo "::error::The Council website refused the request (HTTP $status). This is usually temporary; if it keeps happening, it may be blocking GitHub's servers." ;;
            *) echo "::error::Couldn't fetch the page (HTTP $status)." ;;
          esac
          exit 1

      - name: Check it parses
        env:
          TZ: Pacific/Auckland
        run: tests/run.sh --live page.html
